services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: go_invoicing
      POSTGRES_PASSWORD: go_invoicing_dev
      POSTGRES_DB: go_invoicing
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U go_invoicing -d go_invoicing"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: