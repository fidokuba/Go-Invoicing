services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: go_invoicing
      POSTGRES_PASSWORD: go_invoicing_dev
      POSTGRES_DB: go_invoicing
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U go_invoicing -d go_invoicing"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Invoice-template rendering service (Phases 1 and 4 of custom invoice
  # layouts) — see renderer/src/server.js's own doc comment. Only ever
  # called by the Go API for an invoice whose applicable template is a
  # genuine user-created one (see InvoicePDFService.Generate); the
  # system Classic template always renders via the existing in-process
  # gopdf path, so `docker compose up -d postgres` alone still works for
  # anyone who never customises a layout. context is the repository
  # root, not renderer/ alone — the build also needs one file from web/
  # (see renderer/Dockerfile's own comment).
  renderer:
    build:
      context: .
      dockerfile: renderer/Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: