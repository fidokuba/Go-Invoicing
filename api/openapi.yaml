openapi: "3.1.0"

info:
  title: Go Invoicing API
  version: "1.0.0"
  description: >-
    HTTP API for a multi-tenant invoicing backend. Every product endpoint
    lives under /api/v1; this document's version (1.0.0) tracks that
    contract, not a separate commercial product version. /health and
    /health/db are infrastructure probes and are deliberately excluded from
    the /api/v1 prefix — see the Health tag.


    Tenancy: every protected request's organisation is derived exclusively
    from the authenticated session (the bearer token identifies a user, and
    that user's organisation is fixed at account-creation time). No
    operation accepts a client-supplied organisation identifier, and none
    is documented here. A resource belonging to a different organisation is
    indistinguishable from one that does not exist at all: such a request
    returns 404, never 403, so a client cannot learn anything about another
    tenant's data by probing IDs.


    Authentication: POST /api/v1/auth/login exchanges an email/password for
    an opaque bearer token (not a JWT — no internal structure should be
    assumed or decoded). Send it as `Authorization: Bearer <token>` on every
    protected request. POST /api/v1/auth/logout revokes only the session
    that token belongs to; a user's other active sessions are unaffected.


    Authorization: beyond "authenticated or not", some operations are
    further restricted to specific roles (admin, manager, user). OpenAPI
    security schemes cannot express a per-role matrix, so each such
    operation documents its exact role requirement in its own description.


    Errors: every application-generated error response uses the same
    envelope (see the Error schema): `{"error": {"code": "...", "message":
    "..."}}`. A small set of generic codes (invalid_request,
    validation_failed, unauthorized, forbidden, not_found, conflict,
    internal_error, unsupported_media_type, request_too_large,
    method_not_allowed) covers most failures; a handful of endpoints use a
    more specific code (e.g. invoice_not_found, invoice_already_sent,
    email_already_exists, sku_already_exists) where that gives a client
    genuine value. One deliberate exception: a request to a path with no
    matching route at all returns net/http's plain-text default 404 (`404
    page not found`), not this JSON envelope — every registered route's own
    404s (a real "resource not found") do use the envelope. A 405 for a
    registered path called with the wrong method also uses the JSON
    envelope, with an `Allow` header listing the methods that path accepts.


    Requests: every request body must be `application/json` (a missing or
    different Content-Type returns 415); a body must be a single,
    well-formed JSON value with no fields the destination type doesn't
    recognise (an unknown field, malformed JSON, or trailing extra content
    after the first value all return 400); and every request body is
    bounded in size (413 if exceeded).


    Money: every monetary amount is an integer number of the currency's
    minor units (e.g. GBP 12345 = £123.45) — never a float. An invoice
    carries a single top-level three-letter currency code that applies to
    every monetary field on it, including its lines; there is no per-field
    currency and no multi-currency/exchange-rate support.


    Dates and times: a calendar date (issueDate, dueDate, paymentDate) is
    `YYYY-MM-DD` with no time-of-day or zone. A timestamp (createdAt,
    updatedAt, sentAt, expiresAt) is RFC 3339 in UTC, always ending in `Z`.


    Pagination: every list endpoint returns `{"items": [...], "pagination":
    {"limit", "offset", "total"}}`. limit defaults to 50 and may not exceed
    200; offset defaults to 0. An explicitly supplied invalid value (zero,
    negative, non-numeric, or over the maximum) returns 400 rather than
    being silently clamped. total counts rows matching the current filters,
    not the table overall; an offset beyond total is valid and returns an
    empty items array. The four list endpoints (invoices, customers,
    products, users) reject any query parameter outside their documented
    set with 400 — including `organisationId`, which is never a valid
    parameter anywhere in this API, since tenant selection is never
    client-supplied. Other endpoints do not perform this strict check and
    silently ignore parameters they don't recognise.


    Search: every `search` filter is a case-insensitive substring match
    against the documented fields.

servers:
  - url: /
    description: This API is served relative to its own host; no separate base path is assumed.

tags:
  - name: Authentication
    description: Login and logout.
  - name: Registration
    description: One-time creation of a new organisation and its first (admin) user.
  - name: Organisation
    description: The authenticated caller's own organisation and its invoice-numbering/currency settings.
  - name: Users
    description: Organisation user/team management.
  - name: Customers
    description: Customers and their billing address.
  - name: Products
    description: Product catalogue.
  - name: Invoices
    description: Invoices, their lifecycle, and their PDF.
  - name: Payments
    description: Payments recorded against an invoice.
  - name: Health
    description: Unauthenticated infrastructure probes and this specification document.

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness probe
      description: >-
        Always returns 200 if the process is up. Unversioned and
        unauthenticated. Does not check the database — see /health/db for
        that.
      security: []
      responses:
        "200":
          description: The process is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
              example:
                status: ok

  /health/db:
    get:
      tags: [Health]
      summary: Database readiness probe
      description: >-
        Pings the database. Unversioned and unauthenticated.
      security: []
      responses:
        "200":
          description: The database is reachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
              example:
                status: ok
        "503":
          description: The database is not reachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
              example:
                status: unavailable

  /api/v1/openapi.yaml:
    get:
      tags: [Health]
      summary: This specification
      description: >-
        Returns this document verbatim, byte-for-byte, from the same file
        maintained in source control — there is no second, generated copy
        to drift out of sync. Unauthenticated.
      security: []
      responses:
        "200":
          description: The OpenAPI 3.1 specification for this API.
          content:
            application/yaml:
              schema:
                type: string
                format: binary

  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: Log in
      description: >-
        Exchanges an email and password for a bearer token. There is no
        organisationId field: the user (and therefore their organisation)
        is resolved from email alone, since email is globally unique.
        Unauthenticated. An unknown email, a wrong password, and an
        inactive account are all indistinguishable to the caller — every
        one of them returns the same generic 401.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              email: ada@example.com
              password: correct-horse-battery-staple
      responses:
        "200":
          description: Login succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
              example:
                token: 8f3b1e2c9d4a4f6e8b0a1c2d3e4f5061
                expiresAt: "2026-09-20T09:00:00Z"
                user:
                  id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  organisationId: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                  name: Ada Lovelace
                  email: ada@example.com
                  role: admin
                  isActive: true
                  createdAt: "2026-01-15T10:00:00Z"
                  updatedAt: "2026-01-15T10:00:00Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Invalid email or password.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
              example:
                error: { code: unauthorized, message: invalid email or password }
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      summary: Log out
      description: >-
        Revokes only the session the presented bearer token resolved to.
        Every other active session belonging to the same user (e.g. from
        another device) is left untouched. Protected.
      responses:
        "204":
          description: The current session was revoked. No body.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/register:
    post:
      tags: [Registration]
      summary: Register a new organisation
      description: >-
        The only way a new organisation and its first user can be created.
        Atomically creates the organisation, its default settings (GBP
        currency, 30-day payment terms, "INV-" invoice prefix), and the
        first user — always with role admin, which cannot be requested or
        overridden by the caller; there is no role field in this request.
        Unauthenticated. This endpoint does not log the new user in: no
        token is issued, and no session is created — call POST
        /api/v1/auth/login afterward to obtain one.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            example:
              organisation:
                name: Acme Consulting Ltd
              user:
                name: Ada Lovelace
                email: ada@example.com
                password: correct-horse-battery-staple
      responses:
        "201":
          description: The organisation and its first admin user were created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
              example:
                organisation:
                  id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                  name: Acme Consulting Ltd
                  createdAt: "2026-01-15T10:00:00Z"
                  updatedAt: "2026-01-15T10:00:00Z"
                user:
                  id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  organisationId: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                  name: Ada Lovelace
                  email: ada@example.com
                  role: admin
                  isActive: true
                  createdAt: "2026-01-15T10:00:00Z"
                  updatedAt: "2026-01-15T10:00:00Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: The email is already registered to another user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
              example:
                error: { code: email_already_exists, message: a user with this email already exists }
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/organisation:
    get:
      tags: [Organisation]
      summary: Get the caller's organisation
      description: >-
        A self-resource route: always returns the authenticated caller's
        own organisation. There is no path parameter to select a different
        one, so there is no cross-tenant case here. Any authenticated role
        may call this.
      responses:
        "200":
          description: The caller's organisation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganisationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: The caller's organisation no longer exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          $ref: "#/components/responses/InternalServerError"
    patch:
      tags: [Organisation]
      summary: Update the caller's organisation
      description: >-
        Role required: admin only. Partial update: every field is optional
        — an omitted field is left unchanged. An explicitly supplied empty
        string clears that optional field, except name, which may never
        become blank. There is no path parameter; this always targets the
        caller's own organisation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrganisationRequest"
            example:
              phone: "+44 20 7946 0958"
              website: https://acme.example.com
      responses:
        "200":
          description: The updated organisation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganisationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The caller's organisation no longer exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/organisation/settings:
    get:
      tags: [Organisation]
      summary: Get the caller's invoice-numbering settings
      description: >-
        Every authenticated role may read the organisation's current
        invoice currency, payment terms, and invoice-number prefix. The
        internal invoice-number counter itself is never exposed.
      responses:
        "200":
          description: The caller's organisation settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsResponse"
              example:
                currency: GBP
                paymentTerms: 30
                invoicePrefix: "INV-"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: The caller's organisation has no settings row.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          $ref: "#/components/responses/InternalServerError"
    patch:
      tags: [Organisation]
      summary: Update the caller's invoice-numbering settings
      description: >-
        Role required: admin only, since these settings affect every future
        invoice the tenant produces. Partial update: an omitted field is
        left unchanged. Unlike PATCH /organisation, none of these three
        fields may be cleared to a blank/zero-ish value by supplying one —
        currency and invoicePrefix are business-required strings, and
        paymentTerms already treats 0 ("due immediately") as a meaningful
        value rather than "unset", so an explicitly supplied blank/invalid
        value is rejected (400), not treated as "clear this field".
        Changing currency here has no effect on any invoice that has
        already been sent — see the Invoices tag for why.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSettingsRequest"
            example:
              paymentTerms: 14
      responses:
        "200":
          description: The updated settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The caller's organisation has no settings row.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/users:
    post:
      tags: [Users]
      summary: Create a user
      description: >-
        Role required: admin or manager. An admin may assign any role
        (admin, manager, user); a manager may only create a user with role
        "user" — attempting to assign admin or manager as a manager returns
        403. role is optional and defaults to "user" if omitted. The new
        user always belongs to the caller's own organisation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
            example:
              name: Grace Hopper
              email: grace@example.com
              password: another-strong-password
              role: manager
      responses:
        "201":
          description: The created user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The caller's organisation no longer exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          description: A user with this email already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
              example:
                error: { code: email_already_exists, message: a user with this email already exists }
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalServerError"
    get:
      tags: [Users]
      summary: List users
      description: >-
        Role required: admin or manager. Lists users in the caller's own
        organisation. Default sort is createdAt descending (newest team
        member first).
      parameters:
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/OffsetParam"
        - $ref: "#/components/parameters/OrderParam"
        - name: sort
          in: query
          description: Field to sort by.
          schema:
            type: string
            enum: [email, role, createdAt]
            default: createdAt
        - name: role
          in: query
          description: Filter to exactly one role.
          schema:
            type: string
            enum: [admin, manager, user]
        - name: active
          in: query
          description: Filter by whether the user is active.
          schema:
            type: boolean
      responses:
        "200":
          description: A page of users.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/users/{id}:
    get:
      tags: [Users]
      summary: Get a user
      description: >-
        Every authenticated user may retrieve their own record. Retrieving
        another user's record additionally requires the caller to be admin
        or manager — otherwise this returns 403. A user ID belonging to
        another organisation returns 404, the same as one that doesn't
        exist at all.
      parameters:
        - $ref: "#/components/parameters/IdPathParam"
      responses:
        "200":
          description: The requested user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such user in the caller's organisation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
              example:
                error: { code: user_not_found, message: user not found }
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/customers:
    post:
      tags: [Customers]
      summary: Create a customer
      description: Any authenticated role may create a customer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCustomerRequest"
            example:
              name: Contoso Ltd
              email: billing@contoso.example
              companyName: Contoso Ltd
      responses:
        "201":
          description: The created customer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalServerError"
    get:
      tags: [Customers]
      summary: List customers
      description: >-
        Any authenticated role. Default sort is name ascending (a customer
        list is browsed alphabetically by default).
      parameters:
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/OffsetParam"
        - $ref: "#/components/parameters/OrderParam"
        - name: sort
          in: query
          description: Field to sort by.
          schema:
            type: string
            enum: [name, companyName, createdAt]
            default: name
        - name: search
          in: query
          description: Case-insensitive substring match against name, companyName, or email.
          schema:
            type: string
        - name: status
          in: query
          description: Filter to exactly one status.
          schema:
            type: string
            enum: [active, inactive, archived]
      responses:
        "200":
          description: A page of customers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/customers/{id}:
    get:
      tags: [Customers]
      summary: Get a customer
      description: Any authenticated role. A customer belonging to another organisation returns 404.
      parameters:
        - $ref: "#/components/parameters/IdPathParam"
      responses:
        "200":
          description: The requested customer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such customer in the caller's organisation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
              example:
                error: { code: customer_not_found, message: customer not found }
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/customers/{id}/billing-address:
    get:
      tags: [Customers]
      summary: Get a customer's billing address
      description: Any authenticated role. A customer has at most one billing address.
      parameters:
        - $ref: "#/components/parameters/IdPathParam"
      responses:
        "200":
          description: The customer's billing address.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddressResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: This customer has no billing address, or the customer itself doesn't exist in the caller's organisation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
              example:
                error: { code: billing_address_not_found, message: billing address not found }
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      tags: [Customers]
      summary: Replace a customer's billing address
      description: >-
        Any authenticated role. This is a whole-resource replace, not a
        partial patch: creates the address if the customer has none yet, or
        replaces it entirely if one already exists. street, city,
        postalCode and country are required; state may be omitted.
      parameters:
        - $ref: "#/components/parameters/IdPathParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertBillingAddressRequest"
            example:
              street: 1 High Street
              city: London
              postalCode: SW1A 1AA
              country: GB
      responses:
        "200":
          description: The saved billing address.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddressResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such customer in the caller's organisation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
              example:
                error: { code: customer_not_found, message: customer not found }
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/products:
    post:
      tags: [Products]
      summary: Create a product
      description: >-
        Any authenticated role. price is optional and defaults to 0 if
        omitted; if supplied it must not be negative. A product's price is
        a catalogue reference only — creating an invoice line always
        supplies (or overrides) its own unitPrice, which is never read from
        the product.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductRequest"
            example:
              name: Consulting (half day)
              sku: CONS-HD
              price: 50000
              category: Services
      responses:
        "201":
          description: The created product.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: A product with this SKU already exists in the caller's organisation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
              example:
                error: { code: sku_already_exists, message: a product with this SKU already exists }
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalServerError"
    get:
      tags: [Products]
      summary: List products
      description: >-
        Any authenticated role. Default sort is name ascending (a catalogue
        is browsed alphabetically by default).
      parameters:
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/OffsetParam"
        - $ref: "#/components/parameters/OrderParam"
        - name: sort
          in: query
          description: Field to sort by.
          schema:
            type: string
            enum: [name, sku, price, createdAt]
            default: name
        - name: search
          in: query
          description: Case-insensitive substring match against name or SKU.
          schema:
            type: string
        - name: isActive
          in: query
          description: Filter by whether the product is active.
          schema:
            type: boolean
      responses:
        "200":
          description: A page of products.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/products/{id}:
    get:
      tags: [Products]
      summary: Get a product
      description: Any authenticated role. A product belonging to another organisation returns 404.
      parameters:
        - $ref: "#/components/parameters/IdPathParam"
      responses:
        "200":
          description: The requested product.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such product in the caller's organisation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
              example:
                error: { code: product_not_found, message: product not found }
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/invoices:
    post:
      tags: [Invoices]
      summary: Create a draft invoice
      description: >-
        Any authenticated role. Always creates the invoice as Draft; use
        POST /api/v1/invoices/{id}/send to finalise it. currency on the
        response is the organisation's current settings currency at
        creation time — a Draft invoice has no currency snapshot of its own
        yet (see the currency note below). At least one line is required.
        Each line's unitPrice is always taken from the request, never read
        from productId even when one is supplied — productId, if present,
        is only checked for existence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvoiceRequest"
            example:
              customerId: 11111111-1111-1111-1111-111111111111
              issueDate: "2026-09-19"
              dueDate: "2026-10-19"
              lines:
                - description: Consulting (half day)
                  quantity: 2
                  unitPrice: 50000
                  vatRate: 20
              notes: Thank you for your business.
      responses:
        "201":
          description: The created draft invoice.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceResponse"
              example:
                id: 22222222-2222-2222-2222-222222222222
                organisationId: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                customerId: 11111111-1111-1111-1111-111111111111
                invoiceNumber: "INV-1"
                issueDate: "2026-09-19"
                dueDate: "2026-10-19"
                currency: GBP
                subtotal: 100000
                vatTotal: 20000
                total: 120000
                amountPaid: 0
                amountOutstanding: 120000
                status: draft
                lines:
                  - id: 33333333-3333-3333-3333-333333333333
                    description: Consulting (half day)
                    quantity: 2
                    unitPrice: 50000
                    vatRate: 20
                    vatAmount: 20000
                    total: 120000
                createdAt: "2026-09-19T09:00:00Z"
                updatedAt: "2026-09-19T09:00:00Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: The referenced customer, or a referenced line's product, does not exist in the caller's organisation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          description: The organisation has no settings row, so an invoice number/currency cannot be allocated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalServerError"
    get:
      tags: [Invoices]
      summary: List invoices
      description: >-
        Any authenticated role. Default sort is issueDate descending. Each
        row uses the summary representation (see InvoiceListItemResponse)
        and never includes a "lines" key at all — fetch GET
        /api/v1/invoices/{id} for full line detail.


        status filters on the invoice's effective status (draft, sent,
        overdue, paid), the same value the response's own status field
        shows — not the persisted value. "overdue" is never persisted; it
        is derived, both in this filter and in every row's own status
        field, as "persisted sent AND due date strictly before today
        (UTC)". An invoice due today is not overdue. A persisted draft or
        paid invoice is never reported as overdue regardless of its due
        date.
      parameters:
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/OffsetParam"
        - $ref: "#/components/parameters/OrderParam"
        - name: sort
          in: query
          description: Field to sort by.
          schema:
            type: string
            enum: [invoiceNumber, issueDate, dueDate, total, createdAt]
            default: issueDate
        - name: status
          in: query
          description: Filter to exactly one effective status.
          schema:
            type: string
            enum: [draft, sent, overdue, paid]
        - name: customerId
          in: query
          description: Filter to invoices for exactly one customer.
          schema:
            type: string
            format: uuid
        - name: search
          in: query
          description: Case-insensitive substring match against the invoice number.
          schema:
            type: string
        - name: issueDateFrom
          in: query
          description: Only invoices issued on or after this date. Must not be after issueDateTo, if both are supplied.
          schema:
            type: string
            format: date
        - name: issueDateTo
          in: query
          description: Only invoices issued on or before this date.
          schema:
            type: string
            format: date
        - name: dueDateFrom
          in: query
          description: Only invoices due on or after this date. Must not be after dueDateTo, if both are supplied.
          schema:
            type: string
            format: date
        - name: dueDateTo
          in: query
          description: Only invoices due on or before this date.
          schema:
            type: string
            format: date
      responses:
        "200":
          description: A page of invoices, in the summary representation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceListResponse"
              example:
                items:
                  - id: 22222222-2222-2222-2222-222222222222
                    invoiceNumber: "INV-1"
                    customerId: 11111111-1111-1111-1111-111111111111
                    issueDate: "2026-09-19"
                    dueDate: "2026-10-19"
                    status: sent
                    currency: GBP
                    subtotal: 100000
                    vatTotal: 20000
                    total: 120000
                    amountPaid: 40000
                    amountOutstanding: 80000
                    sentAt: "2026-09-19T09:05:00Z"
                    createdAt: "2026-09-19T09:00:00Z"
                    updatedAt: "2026-09-19T09:05:00Z"
                pagination: { limit: 50, offset: 0, total: 1 }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: An issued invoice on this page has no currency snapshot (only possible for an invoice sent before this API tracked one).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/invoices/{id}:
    get:
      tags: [Invoices]
      summary: Get an invoice
      description: >-
        Any authenticated role. Returns the full representation, including
        lines. A Draft invoice's currency is the organisation's current
        settings currency; a Sent, Overdue or Paid invoice's currency (and
        every seller/customer detail baked into its PDF) is its own
        immutable snapshot captured at Send, unaffected by later changes to
        the organisation's settings, the organisation's own details, or the
        customer's details.
      parameters:
        - $ref: "#/components/parameters/IdPathParam"
      responses:
        "200":
          description: The requested invoice, with lines.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such invoice in the caller's organisation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
              example:
                error: { code: invoice_not_found, message: invoice not found }
        "409":
          description: This invoice's currency cannot be reliably determined (a legacy issued invoice with no currency snapshot).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/invoices/{id}/send:
    post:
      tags: [Invoices]
      summary: Send (finalise) an invoice
      description: >-
        Any authenticated role. A lifecycle/finalisation action only: it
        does not email or otherwise deliver anything to the customer, and
        it does not generate a PDF (call GET .../pdf separately for that).
        Transitions the invoice from Draft to Sent and, in the same
        operation, captures an immutable snapshot of the seller
        (organisation) and customer identity plus the organisation's
        current currency onto the invoice — this snapshot is what every
        later read of this invoice (including its PDF) uses from then on,
        never live data, even if the organisation's or customer's details
        subsequently change. Calling this on an invoice that is already
        Sent or Paid returns 409 and makes no change; it cannot be
        repeated successfully.
      parameters:
        - $ref: "#/components/parameters/IdPathParam"
      responses:
        "200":
          description: The now-Sent invoice, with lines.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such invoice in the caller's organisation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
              example:
                error: { code: invoice_not_found, message: invoice not found }
        "409":
          description: >-
            The invoice is not Draft (already Sent or Paid — cannot be sent
            again), or a required snapshot field (seller name, customer
            name, currency) is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
              example:
                error: { code: invoice_already_sent, message: invoice has already been sent }
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/invoices/{id}/pdf:
    get:
      tags: [Invoices]
      summary: Get an invoice's PDF
      description: >-
        Any authenticated role. Generated synchronously on every call —
        nothing is cached or emailed. A Draft invoice's PDF is rendered
        from the organisation's and customer's current live data; a Sent,
        Overdue or Paid invoice's PDF is rendered exclusively from its
        immutable snapshot captured at Send (see POST .../send), so it
        continues to reflect exactly what was true at that moment even if
        the organisation or customer has since changed. The invoice's
        effective status shown on the PDF may be Overdue or Paid, using the
        same effective-status rule as every other invoice representation.
      parameters:
        - $ref: "#/components/parameters/IdPathParam"
      responses:
        "200":
          description: The invoice as a PDF document.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such invoice in the caller's organisation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
              example:
                error: { code: invoice_not_found, message: invoice not found }
        "409":
          description: Required business data for the PDF (seller name, customer name, currency) is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/invoices/{id}/payments:
    post:
      tags: [Payments]
      summary: Record a payment against an invoice
      description: >-
        Any authenticated role. A Draft invoice cannot accept a payment
        (409); a Sent (including effectively Overdue) invoice can. amount
        must be strictly positive (400 if not) and must not exceed the
        invoice's current outstanding balance (409 if it does — this
        depends on the invoice's current state, so it's a conflict, not a
        malformed request). If this payment exactly exhausts the
        outstanding balance, the invoice is automatically transitioned to
        Paid in the same operation; a partial payment leaves the invoice's
        status unchanged. paymentDate defaults to the current date if
        omitted. There is no refund operation.
      parameters:
        - $ref: "#/components/parameters/IdPathParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentHTTPRequest"
            example:
              amount: 40000
              paymentMethod: bank_transfer
              paymentDate: "2026-09-19"
              reference: "TX-90210"
      responses:
        "201":
          description: The recorded payment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentResponse"
              example:
                id: 44444444-4444-4444-4444-444444444444
                invoiceId: 22222222-2222-2222-2222-222222222222
                amount: 40000
                paymentMethod: bank_transfer
                paymentDate: "2026-09-19"
                reference: "TX-90210"
                createdAt: "2026-09-19T09:05:00Z"
                updatedAt: "2026-09-19T09:05:00Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such invoice in the caller's organisation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
              example:
                error: { code: invoice_not_found, message: invoice not found }
        "409":
          description: The invoice cannot currently accept a payment, or this payment would exceed its outstanding balance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalServerError"
    get:
      tags: [Payments]
      summary: List payments for an invoice
      description: >-
        Any authenticated role. Returns every payment recorded against this
        invoice as a plain array — this endpoint does not use the
        limit/offset pagination envelope every other list endpoint uses.
      parameters:
        - $ref: "#/components/parameters/IdPathParam"
      responses:
        "200":
          description: Every payment recorded against this invoice.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PaymentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such invoice in the caller's organisation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
              example:
                error: { code: invoice_not_found, message: invoice not found }
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        An opaque, server-side session token issued by POST
        /api/v1/auth/login — not a JWT, and not decodable by a client.
        Send as `Authorization: Bearer <token>`.

  parameters:
    IdPathParam:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LimitParam:
      name: limit
      in: query
      description: Maximum number of items to return. Defaults to 50; must not exceed 200.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    OffsetParam:
      name: offset
      in: query
      description: Number of matching items to skip. Defaults to 0.
      schema:
        type: integer
        minimum: 0
        default: 0
    OrderParam:
      name: order
      in: query
      description: Sort direction.
      schema:
        type: string
        enum: [asc, desc]

  responses:
    BadRequest:
      description: The request was malformed, or failed validation, or an explicitly supplied query parameter was invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          example:
            error: { code: validation_failed, message: a field failed validation }
    Unauthorized:
      description: No valid bearer token was presented (missing, malformed, unknown, expired, or revoked session; or the user is inactive).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          example:
            error: { code: unauthorized, message: unauthorized }
    Forbidden:
      description: The caller is authenticated but their role does not permit this operation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          example:
            error: { code: forbidden, message: forbidden }
    NotFound:
      description: The resource does not exist in the caller's organisation (or does not exist at all).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    Conflict:
      description: The request is valid but conflicts with the resource's current state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    UnsupportedMediaType:
      description: The request body's Content-Type was missing or was not application/json.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          example:
            error: { code: unsupported_media_type, message: "Content-Type must be application/json" }
    PayloadTooLarge:
      description: The request body exceeded the maximum allowed size.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          example:
            error: { code: request_too_large, message: request body exceeds the maximum allowed size }
    InternalServerError:
      description: An unexpected server-side failure.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          example:
            error: { code: internal_error, message: internal server error }

  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]

    ErrorDetail:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: A stable, machine-readable identifier. See this document's top-level description for the generic set; some endpoints use a more specific value.
        message:
          type: string
          description: A human-readable explanation, safe to display — never SQL, stack traces, or other internal detail.

    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"

    Pagination:
      type: object
      required: [limit, offset, total]
      properties:
        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer
          format: int64
          description: Count of rows matching the current filters, not the table's overall row count.

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    LoginResponse:
      type: object
      required: [token, expiresAt, user]
      properties:
        token:
          type: string
          description: The raw bearer token. Returned exactly once, here — it cannot be retrieved again after this response.
        expiresAt:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/UserResponse"

    RegisterOrganisationRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string

    RegisterUserRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
        email:
          type: string
        password:
          type: string
          description: Minimum 12 characters.

    RegisterRequest:
      type: object
      required: [organisation, user]
      properties:
        organisation:
          $ref: "#/components/schemas/RegisterOrganisationRequest"
        user:
          $ref: "#/components/schemas/RegisterUserRequest"

    RegisterResponse:
      type: object
      required: [organisation, user]
      properties:
        organisation:
          $ref: "#/components/schemas/OrganisationResponse"
        user:
          $ref: "#/components/schemas/UserResponse"

    UserResponse:
      type: object
      required: [id, organisationId, name, email, role, isActive, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        organisationId:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [admin, manager, user]
        isActive:
          type: boolean
        lastLogin:
          type: string
          format: date-time
          description: Present only once the user has logged in at least once.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateUserRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
        email:
          type: string
        password:
          type: string
          description: Minimum 12 characters.
        role:
          type: string
          enum: [admin, manager, user]
          description: Defaults to "user" if omitted. See the operation description for who may assign which role.

    UserListResponse:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/UserResponse"
        pagination:
          $ref: "#/components/schemas/Pagination"

    OrganisationResponse:
      type: object
      required: [id, name, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        website:
          type: string
        address:
          type: string
        city:
          type: string
        state:
          type: string
        postalCode:
          type: string
        country:
          type: string
        taxId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UpdateOrganisationRequest:
      type: object
      description: Every field is optional — omit a field to leave it unchanged. All fields except name may be cleared by supplying an empty string.
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        website:
          type: string
        address:
          type: string
        city:
          type: string
        state:
          type: string
        postalCode:
          type: string
        country:
          type: string
        taxId:
          type: string

    SettingsResponse:
      type: object
      required: [currency, paymentTerms, invoicePrefix]
      properties:
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
          description: A 3-letter code shaped like an ISO 4217 currency code — not validated against an actual currency catalogue.
        paymentTerms:
          type: integer
          description: Default number of days a new invoice's due date is set from its issue date. 0 means "due immediately".
        invoicePrefix:
          type: string
          description: Prepended to the sequential invoice number, e.g. "INV-" + "1" = "INV-1".

    UpdateSettingsRequest:
      type: object
      description: >-
        Every field is optional — omit a field to leave it unchanged.
        Unlike UpdateOrganisationRequest, none of these fields may be
        cleared with a blank/invalid value: an explicitly supplied blank
        currency/invoicePrefix or a negative paymentTerms is rejected (400).
      properties:
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        paymentTerms:
          type: integer
          minimum: 0
        invoicePrefix:
          type: string

    CustomerResponse:
      type: object
      required: [id, organisationId, name, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        organisationId:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        companyName:
          type: string
        taxId:
          type: string
        status:
          type: string
          enum: [active, inactive, archived]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateCustomerRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        email:
          type: string
          description: A business contact address, not a login credential — not format-validated the way a user's email is.
        phone:
          type: string
        companyName:
          type: string
        taxId:
          type: string

    CustomerListResponse:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CustomerResponse"
        pagination:
          $ref: "#/components/schemas/Pagination"

    AddressResponse:
      type: object
      required: [id, customerId, type, street, city, postalCode, country, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        type:
          type: string
          enum: [billing]
        street:
          type: string
        city:
          type: string
        state:
          type: string
          description: Omitted from the response entirely when blank.
        postalCode:
          type: string
        country:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UpsertBillingAddressRequest:
      type: object
      required: [street, city, postalCode, country]
      properties:
        street:
          type: string
        city:
          type: string
        state:
          type: string
          description: Optional — not every country uses one.
        postalCode:
          type: string
        country:
          type: string

    ProductResponse:
      type: object
      required: [id, organisationId, name, sku, price, isActive, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        organisationId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        sku:
          type: string
        price:
          type: integer
          format: int64
          description: Integer minor units (e.g. cents). A catalogue reference price only — never read by invoice-line creation.
        category:
          type: string
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateProductRequest:
      type: object
      required: [name, sku]
      properties:
        name:
          type: string
        description:
          type: string
        sku:
          type: string
          description: Must be unique within the organisation.
        price:
          type: integer
          format: int64
          minimum: 0
          default: 0
          description: Integer minor units. Optional; defaults to 0 if omitted.
        category:
          type: string

    ProductListResponse:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProductResponse"
        pagination:
          $ref: "#/components/schemas/Pagination"

    CreateInvoiceLineRequest:
      type: object
      required: [description, quantity]
      properties:
        productId:
          type: string
          format: uuid
          description: Optional. Only checked for existence within the organisation — its price is never read; unitPrice always comes from this request.
        description:
          type: string
        quantity:
          type: number
          exclusiveMinimum: 0
        unitPrice:
          type: integer
          format: int64
          minimum: 0
          default: 0
          description: Integer minor units. Optional; defaults to 0 if omitted.
        vatRate:
          type: number
          minimum: 0
          default: 0
          description: A percentage (e.g. 20 means 20%). Optional; defaults to 0 if omitted.

    CreateInvoiceRequest:
      type: object
      required: [customerId, issueDate, dueDate, lines]
      properties:
        customerId:
          type: string
          format: uuid
        issueDate:
          type: string
          format: date
        dueDate:
          type: string
          format: date
          description: Must not be before issueDate.
        lines:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CreateInvoiceLineRequest"
        notes:
          type: string

    InvoiceLineResponse:
      type: object
      required: [id, description, quantity, unitPrice, vatRate, vatAmount, total]
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        description:
          type: string
        quantity:
          type: number
        unitPrice:
          type: integer
          format: int64
        vatRate:
          type: number
        vatAmount:
          type: integer
          format: int64
        total:
          type: integer
          format: int64

    InvoiceResponse:
      type: object
      description: >-
        The full invoice representation, including lines. See
        InvoiceListItemResponse for the smaller representation GET
        /api/v1/invoices uses instead.
      required:
        - id
        - organisationId
        - customerId
        - invoiceNumber
        - issueDate
        - dueDate
        - currency
        - subtotal
        - vatTotal
        - total
        - amountPaid
        - amountOutstanding
        - status
        - lines
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        organisationId:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        invoiceNumber:
          type: string
        issueDate:
          type: string
          format: date
        dueDate:
          type: string
          format: date
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
          description: Draft uses the organisation's current settings currency; Sent/Overdue/Paid use the invoice's own immutable snapshot, unaffected by later settings changes.
        subtotal:
          type: integer
          format: int64
        vatTotal:
          type: integer
          format: int64
        total:
          type: integer
          format: int64
        amountPaid:
          type: integer
          format: int64
        amountOutstanding:
          type: integer
          format: int64
        status:
          type: string
          enum: [draft, sent, overdue, paid]
          description: The invoice's effective status, not necessarily its persisted one — see the Invoices tag's overdue rule.
        sentAt:
          type: string
          format: date-time
          description: Present only once the invoice has been sent.
        notes:
          type: string
        lines:
          type: array
          items:
            $ref: "#/components/schemas/InvoiceLineResponse"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    InvoiceListItemResponse:
      type: object
      description: >-
        The summary representation GET /api/v1/invoices returns for every
        row. Deliberately has no "lines" key at all — not even an empty
        array — since an empty array there would ambiguously mean "this
        invoice has zero lines" rather than "lines weren't loaded for this
        representation". Also omits organisationId (the caller already
        knows its own organisation) and notes. Fetch GET
        /api/v1/invoices/{id} for full line detail.
      required:
        - id
        - invoiceNumber
        - customerId
        - issueDate
        - dueDate
        - status
        - currency
        - subtotal
        - vatTotal
        - total
        - amountPaid
        - amountOutstanding
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        invoiceNumber:
          type: string
        customerId:
          type: string
          format: uuid
        issueDate:
          type: string
          format: date
        dueDate:
          type: string
          format: date
        status:
          type: string
          enum: [draft, sent, overdue, paid]
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        subtotal:
          type: integer
          format: int64
        vatTotal:
          type: integer
          format: int64
        total:
          type: integer
          format: int64
        amountPaid:
          type: integer
          format: int64
        amountOutstanding:
          type: integer
          format: int64
        sentAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    InvoiceListResponse:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/InvoiceListItemResponse"
        pagination:
          $ref: "#/components/schemas/Pagination"

    CreatePaymentHTTPRequest:
      type: object
      required: [amount]
      properties:
        amount:
          type: integer
          format: int64
          exclusiveMinimum: 0
          description: Integer minor units. Must not exceed the invoice's current outstanding balance.
        paymentMethod:
          type: string
          description: 'A free-text label (e.g. "cash", "credit_card", "bank_transfer", "check") — not currently constrained to a fixed set by the server.'
        paymentDate:
          type: string
          format: date
          description: Defaults to the current date if omitted.
        reference:
          type: string
        notes:
          type: string

    PaymentResponse:
      type: object
      required: [id, invoiceId, amount, paymentMethod, paymentDate, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        invoiceId:
          type: string
          format: uuid
        amount:
          type: integer
          format: int64
        paymentMethod:
          type: string
        paymentDate:
          type: string
          format: date
        reference:
          type: string
        notes:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
